<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | Página no encontrada - EL ROPERO</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖤</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #FAF8F5;
        color: #000000;
      }
      .font-serif {
        font-family: 'Playfair Display', serif;
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center p-6 selection:bg-black selection:text-white">
    <div class="max-w-[450px] w-full text-center space-y-12 animate-in fade-in duration-700">
      
      <!-- Logo o Header de Marca -->
      <div class="space-y-2">
        <p class="text-[10px] tracking-[6px] uppercase opacity-40 font-light">ERROR</p>
        <h1 class="text-[64px] font-extralight tracking-[8px] uppercase font-serif leading-none text-black">404</h1>
      </div>

      <!-- Mensaje de Error -->
      <div class="space-y-4">
        <h2 class="text-[14px] tracking-[4px] uppercase font-medium text-black">Página no encontrada</h2>
        <div class="w-8 h-px bg-black/20 mx-auto"></div>
        <p class="text-[12px] tracking-[1.5px] uppercase leading-relaxed text-black/60 font-light max-w-[320px] mx-auto">
          La dirección a la que intentás acceder no existe, ha sido movida o ya no está disponible.
        </p>
      </div>

      <!-- Botón de retorno a la tienda -->
      <div class="pt-6">
        <a
          href="/"
          class="inline-block w-full bg-black text-white py-5 text-[11px] tracking-[4px] uppercase font-medium hover:bg-neutral-800 transition-all shadow-md active:scale-[0.98]"
        >
          Volver a la tienda
        </a>
      </div>

      <!-- Footer sutil -->
      <div class="pt-10 border-t border-black/5">
        <p class="text-[9px] uppercase tracking-[3px] font-light text-black/40">
          EL ROPERO SHOWROOM
        </p>
      </div>

    </div>
  </body>
</html>
